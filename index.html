<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Sree Chinakkathoor Bhagavathi Temple — Donation Register</title>
<meta name="description" content="Donation register and receipt app for Sree Chinakkathoor Bhagavathi Temple, Palappuram">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#7A1F2B">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Temple Donations">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Noto+Sans+Devanagari:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --maroon:#7A1F2B;
    --maroon-dark:#4E1219;
    --gold:#C79A3D;
    --gold-light:#E9CD8E;
    --cream:#FBF6EA;
    --cream-dark:#F1E6C9;
    --ink:#2B1D14;
    --ink-soft:#5C4A3A;
    --green:#3F5D3A;
    --line:#E2D3AE;
    --danger:#A23B2E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .app{max-width:1000px;margin:0 auto;padding:0 0 60px;}

  /* ---------- Header ---------- */
  header.site{
    background:linear-gradient(180deg,var(--maroon) 0%,var(--maroon-dark) 100%);
    color:var(--cream);
    padding:28px 24px 22px;
    text-align:center;
    position:relative;
  }
  header.site .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold-light);
    margin-bottom:6px;
  }
  header.site h1{
    font-family:'Yatra One',cursive;
    font-weight:400;
    font-size:clamp(26px,4vw,38px);
    margin:0 0 6px;
    letter-spacing:.02em;
  }
  header.site .addr{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:16px;
    color:var(--cream-dark);
    opacity:.9;
  }
  .spire-divider{
    display:flex;justify-content:center;gap:4px;margin-top:14px;
  }
  .spire-divider span{
    width:0;height:0;
    border-left:7px solid transparent;
    border-right:7px solid transparent;
    border-bottom:12px solid var(--gold);
    opacity:.85;
  }
  .spire-divider span:nth-child(3n+1){opacity:.5;transform:scale(.8);}

  /* ---------- Nav ---------- */
  nav.tabs{
    display:flex;
    gap:2px;
    background:var(--cream-dark);
    border-bottom:2px solid var(--gold);
  }
  nav.tabs button{
    flex:1;
    padding:14px 10px;
    background:transparent;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    letter-spacing:.03em;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:3px solid transparent;
    transition:all .15s ease;
  }
  nav.tabs button:hover{color:var(--maroon);}
  nav.tabs button.active{
    color:var(--maroon);
    border-bottom-color:var(--maroon);
    background:var(--cream);
  }

  main{padding:26px 20px;}
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:24px;
    margin-bottom:20px;
    box-shadow:0 1px 3px rgba(74,30,20,.06);
  }
  .card h2{
    font-family:'Cormorant Garamond',serif;
    font-weight:700;
    font-size:22px;
    color:var(--maroon-dark);
    margin:0 0 18px;
    padding-bottom:12px;
    border-bottom:1px solid var(--line);
  }

  /* ---------- Form ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .field.full{grid-column:1/-1;}
  label{
    font-size:12.5px;font-weight:600;color:var(--ink-soft);
    letter-spacing:.02em;
  }
  input,select,textarea{
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:7px;
    background:var(--cream);
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--maroon);}
  input[type=number]{font-family:'IBM Plex Mono',monospace;}
  .amount-words{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:14px;
    color:var(--green);
    min-height:18px;
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14.5px;
    padding:12px 22px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    letter-spacing:.02em;
    transition:transform .1s, box-shadow .15s;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--maroon);color:#fff;}
  .btn-primary:hover{background:var(--maroon-dark);}
  .btn-gold{background:var(--gold);color:var(--maroon-dark);}
  .btn-gold:hover{background:var(--gold-light);}
  .btn-ghost{background:transparent;color:var(--maroon);border:1.5px solid var(--maroon);}
  .btn-ghost:hover{background:var(--cream-dark);}
  .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* ---------- Ledger ---------- */
  .ledger-controls{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .ledger-controls input{flex:1;min-width:160px;}
  .stats{display:flex;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .stat{
    background:var(--cream-dark);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 18px;
    min-width:140px;
  }
  .stat .n{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;color:var(--maroon-dark);}
  .stat .l{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{
    text-align:left;padding:10px 8px;
    font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-soft);border-bottom:2px solid var(--gold);
  }
  td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  td.amt{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--maroon-dark);}
  tr:hover td{background:var(--cream);}
  .pill{
    display:inline-block;padding:2px 9px;border-radius:20px;
    font-size:11px;font-weight:600;
    background:var(--cream-dark);color:var(--green);
  }
  .link-btn{
    background:none;border:none;color:var(--maroon);font-weight:600;
    font-size:13px;cursor:pointer;text-decoration:underline;padding:0;
  }
  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty .big{font-family:'Yatra One',cursive;font-size:20px;color:var(--maroon);margin-bottom:6px;}

  /* ---------- Receipt Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(43,29,20,.55);
    display:none;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .overlay.show{display:flex;}
  .receipt-wrap{
    position:relative;
    background:#fff;border-radius:10px;max-width:560px;width:100%;
    max-height:92vh;overflow-y:auto;
  }
  .receipt-print{
    padding:32px 30px;
    border:2px solid var(--gold);
    margin:14px;
    border-radius:6px;
    background:
      repeating-linear-gradient(135deg, rgba(199,154,61,.035) 0 2px, transparent 2px 14px);
  }
  .receipt-head{text-align:center;border-bottom:2px dashed var(--gold);padding-bottom:14px;margin-bottom:16px;}
  .receipt-head .om{display:block;margin:0 auto 4px;}
  .receipt-head h3{
    font-family:'Yatra One',cursive;font-weight:400;
    color:var(--maroon-dark);font-size:21px;margin:6px 0 4px;
  }
  .receipt-head .a2{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13.5px;color:var(--ink-soft);}
  .receipt-meta{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:12.5px;margin-bottom:16px;color:var(--ink-soft);}
  .receipt-meta b{color:var(--maroon-dark);}
  .receipt-body p{font-size:14.5px;line-height:1.9;margin:0 0 10px;}
  .receipt-body .label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
  .receipt-body .val{font-weight:600;color:var(--ink);}
  .receipt-amount-box{
    background:var(--cream-dark);border:1px solid var(--gold);border-radius:8px;
    padding:12px 16px;margin:14px 0;text-align:center;
  }
  .receipt-amount-box .figure{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;color:var(--maroon-dark);}
  .receipt-amount-box .words{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13.5px;color:var(--green);margin-top:4px;}
  .receipt-foot{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-top:30px;padding-top:14px;border-top:1px dashed var(--gold);
  }
  .sign-line{width:160px;border-top:1px solid var(--ink-soft);text-align:center;font-size:11px;color:var(--ink-soft);padding-top:4px;}
  .receipt-actions{padding:14px 22px 22px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);}
  .close-x{
    position:absolute;top:10px;right:14px;background:none;border:none;
    font-size:22px;color:var(--ink-soft);cursor:pointer;line-height:1;
  }

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--maroon-dark);color:#fff;padding:10px 20px;border-radius:8px;
    font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;
  }
  .toast.show{opacity:1;}

  @media(max-width:640px){.grid{grid-template-columns:1fr;}}

  /* ---------- Install button ---------- */
  .install-btn{
    margin-top:14px;
    background:var(--gold);
    color:var(--maroon-dark);
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13.5px;
    padding:9px 20px;
    border-radius:20px;
    cursor:pointer;
  }
  .install-btn:hover{background:var(--gold-light);}
  .lang-toggle{
    position:absolute; top:14px; right:14px;
    display:flex; background:rgba(0,0,0,.22); border-radius:20px; padding:3px;
    gap:2px;
  }
  .lang-btn{
    background:transparent; border:none; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:600; font-size:11.5px;
    color:var(--cream-dark); padding:6px 12px; border-radius:16px;
    transition:all .15s ease;
  }
  .lang-btn.active{background:var(--gold); color:var(--maroon-dark);}
  .ios-hint{
    margin-top:12px;
    font-size:12px;
    color:var(--cream-dark);
    background:rgba(0,0,0,.18);
    display:inline-block;
    padding:6px 14px;
    border-radius:20px;
  }

  /* ---------- Mobile responsiveness ---------- */
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  @media(max-width:640px){
    body{font-size:15px;}
    main{padding:16px 12px;}
    .card{padding:16px;border-radius:8px;}
    nav.tabs{overflow-x:auto; -webkit-overflow-scrolling:touch; flex-wrap:nowrap;}
    nav.tabs button{flex:0 0 auto; padding:12px 14px; font-size:12.5px; white-space:nowrap;}
    table{font-size:13px;}
    th,td{padding:8px 6px;}
    .receipt-actions{flex-wrap:wrap;}
    .receipt-actions button{flex:1 1 auto; min-width:100px;}
    .btn-row{flex-wrap:wrap;}
    .btn-row .btn{width:100%;}
    .stats{gap:8px;}
    .stat{flex:1 1 auto; min-width:100px; padding:10px 12px;}
    .receipt-print{margin:8px; padding:20px 16px;}
    .receipt-foot{flex-direction:column; align-items:flex-start; gap:14px;}
    .sign-line{align-self:flex-end;}
  }

  /* ---------- Print ---------- */
  @media print{
    body *{visibility:hidden;}
    .receipt-print,.receipt-print *{visibility:visible;}
    .receipt-print{
      position:absolute;top:0;left:0;width:100%;margin:0;border:none;
      background:none;
    }
    .overlay{background:none;position:static;padding:0;}
    .receipt-wrap{max-height:none;box-shadow:none;}
    .receipt-actions,.close-x{display:none;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="site">
    <div class="lang-toggle" id="langToggle">
      <button data-lang="en" class="lang-btn active">EN</button>
      <button data-lang="ml" class="lang-btn">മലയാളം</button>
    </div>
    <div class="eyebrow" data-i18n="eyebrow">Donation Register &amp; Receipt</div>
    <h1 data-i18n="temple_name">Sree Chinakkathoor Bhagavathi Temple</h1>
    <div class="addr" data-i18n="temple_addr">Palappuram, Ottapalam, Kerala 679103</div>
    <div class="spire-divider">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <button id="installBtn" class="install-btn" style="display:none;" data-i18n="install_btn">⬇ Install App</button>
    <div id="iosInstallHint" class="ios-hint" style="display:none;" data-i18n-html="ios_hint">Tap <b>Share</b> then <b>"Add to Home Screen"</b> to install</div>
  </header>

  <nav class="tabs">
    <button class="active" data-tab="new" data-i18n="tab_new">＋ New Donation</button>
    <button data-tab="ledger" data-i18n="tab_ledger">Ledger</button>
    <button data-tab="reports" data-i18n="tab_reports">Reports</button>
    <button data-tab="settings" data-i18n="tab_settings">Settings</button>
  </nav>

  <main>
    <!-- NEW DONATION -->
    <section id="tab-new">
      <div class="card">
        <h2 data-i18n="card_title_new">Record a Donation</h2>
        <form id="donationForm">
          <div class="grid">
            <div class="field">
              <label for="donorName" data-i18n="label_donor_name">Donor Name *</label>
              <input type="text" id="donorName" required data-i18n-ph="placeholder_donor_name" placeholder="Full name">
            </div>
            <div class="field">
              <label for="donorPhone" data-i18n="label_donor_phone">Phone Number</label>
              <input type="tel" id="donorPhone" data-i18n-ph="placeholder_donor_phone" placeholder="10-digit mobile number">
            </div>
          </div>
          <div class="field full">
            <label for="donorAddress" data-i18n="label_donor_address">Address</label>
            <input type="text" id="donorAddress" data-i18n-ph="placeholder_donor_address" placeholder="City / District (optional)">
          </div>
          <div class="grid">
            <div class="field">
              <label for="amount" data-i18n="label_amount">Amount (₹) *</label>
              <input type="number" id="amount" required min="1" step="1" placeholder="0">
              <div class="amount-words" id="amountWords"></div>
            </div>
            <div class="field">
              <label for="paymentMode" data-i18n="label_payment_mode">Payment Mode *</label>
              <select id="paymentMode" required></select>
            </div>
          </div>
          <div class="grid">
            <div class="field">
              <label for="purpose" data-i18n="label_purpose">Purpose *</label>
              <select id="purpose" required></select>
              <div class="amount-words" id="purposeHint" data-i18n="purpose_hint">Suggested rates for Chinakkathoor Pooram 2027</div>
            </div>
            <div class="field" id="otherPurposeWrap" style="display:none;">
              <label for="otherPurpose" data-i18n="label_other_purpose">Specify Purpose</label>
              <input type="text" id="otherPurpose" data-i18n-ph="placeholder_other_purpose" placeholder="e.g. Deepam sponsorship">
            </div>
            <div class="field">
              <label for="donationDate" data-i18n="label_date">Date *</label>
              <input type="date" id="donationDate" required>
            </div>
          </div>
          <div class="btn-row">
            <button type="submit" class="btn btn-primary" data-i18n="btn_save_receipt">Save &amp; Generate Receipt</button>
          </div>
        </form>
      </div>
    </section>

    <!-- LEDGER -->
    <section id="tab-ledger" style="display:none;">
      <div class="card">
        <h2 data-i18n="card_title_ledger">Donation Ledger</h2>
        <div class="stats" id="stats"></div>
        <div class="ledger-controls">
          <input type="text" id="searchBox" data-i18n-ph="placeholder_search" placeholder="Search by name or receipt no...">
          <input type="date" id="filterDate" title="Filter by date">
          <button class="btn btn-ghost" id="clearFilters" data-i18n="btn_clear">Clear</button>
          <button class="btn btn-gold" id="exportExcelBtn" data-i18n="btn_export_excel">⬇ Export to Excel</button>
        </div>
        <div id="ledgerTableWrap"></div>
      </div>
    </section>

    <!-- REPORTS -->
    <section id="tab-reports" style="display:none;">
      <div class="card">
        <h2 data-i18n="card_title_reports">Donation Reports</h2>
        <div class="ledger-controls">
          <select id="reportYear"></select>
        </div>
        <div id="reportContent"></div>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="tab-settings" style="display:none;">
      <div class="card">
        <h2 data-i18n="card_title_settings">Office Settings</h2>
        <form id="settingsForm">
          <div class="grid">
            <div class="field">
              <label for="secretaryName" data-i18n="label_signatory_name">Signatory Name</label>
              <input type="text" id="secretaryName" placeholder="e.g. Raman">
            </div>
            <div class="field">
              <label for="secretaryDesignation" data-i18n="label_designation">Designation</label>
              <input type="text" id="secretaryDesignation" placeholder="e.g. Secretary">
            </div>
          </div>
          <div class="field full">
            <label for="secretaryPhone" data-i18n="label_contact_number">Contact Number</label>
            <input type="tel" id="secretaryPhone" placeholder="+91...">
          </div>
          <div class="grid">
            <div class="field">
              <label for="panNumber" data-i18n="label_temple_pan">Temple PAN</label>
              <input type="text" id="panNumber" placeholder="e.g. AAATC1234A">
            </div>
            <div class="field">
              <label for="reg80g" data-i18n="label_80g">80G Registration No.</label>
              <input type="text" id="reg80g" placeholder="e.g. AAATC1234A/80G/2024">
            </div>
          </div>
          <div class="btn-row">
            <button type="submit" class="btn btn-primary" data-i18n="btn_save_settings">Save Settings</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</div>

<!-- RECEIPT MODAL -->
<div class="overlay" id="receiptOverlay">
  <div class="receipt-wrap">
    <button class="close-x" id="closeReceipt">&times;</button>
    <div class="receipt-print" id="receiptPrintArea"></div>
    <div class="receipt-actions">
      <button class="btn btn-ghost" id="closeReceiptBtn" data-i18n="btn_close">Close</button>
      <button class="btn btn-gold" id="downloadPdfBtn" data-i18n="btn_download_pdf">⬇ Download PDF</button>
      <button class="btn btn-primary" id="printReceiptBtn" data-i18n="btn_print">🖨 Print</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TEMPLE_NAME = "Sree Chinakkathoor Bhagavathi Temple";
const TEMPLE_ADDR = "Palappuram, Ottapalam, Kerala 679103";
const RECEIPT_PREFIX = "SCBT";
const STORAGE_KEY = "donations-ledger";
const COUNTER_KEY = "receipt-counter";
const SETTINGS_KEY = "temple-settings";
const LANG_KEY = "app-lang";

// ---------- i18n ----------
const I18N = {
  en: {
    eyebrow: "Donation Register & Receipt",
    temple_name: "Sree Chinakkathoor Bhagavathi Temple",
    temple_addr: "Palappuram, Ottapalam, Kerala 679103",
    install_btn: "⬇ Install App",
    ios_hint: 'Tap <b>Share</b> then <b>"Add to Home Screen"</b> to install',
    tab_new: "＋ New Donation",
    tab_ledger: "Ledger",
    tab_reports: "Reports",
    tab_settings: "Settings",
    card_title_new: "Record a Donation",
    label_donor_name: "Donor Name *",
    placeholder_donor_name: "Full name",
    label_donor_phone: "Phone Number",
    placeholder_donor_phone: "10-digit mobile number",
    label_donor_address: "Address",
    placeholder_donor_address: "City / District (optional)",
    label_amount: "Amount (₹) *",
    label_payment_mode: "Payment Mode *",
    label_purpose: "Purpose *",
    purpose_hint: "Suggested rates for Chinakkathoor Pooram 2027",
    label_other_purpose: "Specify Purpose",
    placeholder_other_purpose: "e.g. Deepam sponsorship",
    label_date: "Date *",
    btn_save_receipt: "Save & Generate Receipt",
    card_title_ledger: "Donation Ledger",
    stat_today: "Today's Collection",
    stat_records: "Records Shown",
    stat_total_filtered: "Total (Filtered)",
    placeholder_search: "Search by name or receipt no...",

// Indian numbering amount-in-words
const ONES = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten",
  "Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
const TENS = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];

function twoDigits(n){
  if(n < 20) return ONES[n];
  return TENS[Math.floor(n/10)] + (n%10 ? " " + ONES[n%10] : "");
}
function threeDigits(n){
  if(n < 100) return twoDigits(n);
  return ONES[Math.floor(n/100)] + " Hundred" + (n%100 ? " " + twoDigits(n%100) : "");
}
function amountToWords(num){
  num = Math.floor(Number(num) || 0);
  if(num === 0) return "Zero Rupees Only";
  let parts = [];
  const crore = Math.floor(num / 10000000); num %= 10000000;
  const lakh = Math.floor(num / 100000); num %= 100000;
  const thousand = Math.floor(num / 1000); num %= 1000;
  const rest = num;
  if(crore) parts.push(threeDigits(crore) + " Crore");
  if(lakh) parts.push(threeDigits(lakh) + " Lakh");
  if(thousand) parts.push(threeDigits(thousand) + " Thousand");
  if(rest) parts.push(threeDigits(rest));
  return parts.join(" ") + " Rupees Only";
}

// ---------- Storage ----------
// Uses localStorage: works on any real website (GitHub Pages, any host), no backend needed.
// Note: data is stored per-device/per-browser, not shared across multiple phones/computers.
function storageGet(key){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function storageSet(key, value){
  try{
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  }catch(e){ return false; }
}

async function loadData(){
  const d = storageGet(STORAGE_KEY);
  donations = Array.isArray(d) ? d : [];

  const c = storageGet(COUNTER_KEY);
  counter = c && typeof c.seq === 'number' ? c : { year: new Date().getFullYear(), seq: 0 };

  const s = storageGet(SETTINGS_KEY);
  if(s){
    settings = s;
  } else {
    // first run: seed default settings
    storageSet(SETTINGS_KEY, settings);
  }
}
async function saveSettings(){
  if(!storageSet(SETTINGS_KEY, settings)){
    showToast(t('toast_save_settings_error'));
  }
}
async function saveDonations(){
  if(!storageSet(STORAGE_KEY, donations)){
    showToast(t('toast_save_error'));
  }
}
async function saveCounter(){
  storageSet(COUNTER_KEY, counter);
}

async function nextReceiptNo(){
  const yr = new Date().getFullYear();
  if(counter.year !== yr){ counter.year = yr; counter.seq = 0; }
  counter.seq += 1;
  await saveCounter();
  return `${RECEIPT_PREFIX}/${yr}/${pad(counter.seq,4)}`;
}

function populatePurposeOptions(preserveKey){
  const current = preserveKey || purposeSelect.value || 'general';
  purposeSelect.innerHTML = PURPOSE_ITEMS.map(item =>
    `<option value="${item.key}">${purposeLabel(item)}</option>`
  ).join('');
  purposeSelect.value = PURPOSE_ITEMS.some(i=>i.key===current) ? current : 'general';
  otherWrap.style.display = purposeSelect.value === 'other' ? '' : 'none';
}
function populatePaymentModeOptions(preserveKey){
  const current = preserveKey || paymentModeSelect.value || 'UPI';
  paymentModeSelect.innerHTML = PAYMENT_MODES.map(item =>
    `<option value="${item.key}">${purposeLabel(item)}</option>`
  ).join('');
  paymentModeSelect.value = PAYMENT_MODES.some(i=>i.key===current) ? current : 'UPI';
}

purposeSelect.addEventListener('change', ()=>{
  otherWrap.style.display = purposeSelect.value === 'other' ? '' : 'none';
  const item = PURPOSE_ITEMS.find(i => i.key === purposeSelect.value);
  if(item && item.amount){
    amountInput.value = item.amount;
    document.getElementById('amountWords').textContent = amountToWordsLocalized(item.amount);
  }
});

amountInput.addEventListener('input', ()=>{
  const v = amountInput.value;
  document.getElementById('amountWords').textContent = v ? amountToWordsLocalized(v) : '';
});

document.getElementById('donationDate').value = todayStr();

function populateSettingsForm(){
  document.getElementById('secretaryName').value = settings.secretaryName || '';
  document.getElementById('secretaryDesignation').value = settings.secretaryDesignation || '';
  document.getElementById('secretaryPhone').value = settings.secretaryPhone || '';
  document.getElementById('panNumber').value = settings.panNumber || '';
  document.getElementById('reg80g').value = settings.reg80g || '';
}
document.getElementById('settingsForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  settings.secretaryName = document.getElementById('secretaryName').value.trim();
  settings.secretaryDesignation = document.getElementById('secretaryDesignation').value.trim();
  settings.secretaryPhone = document.getElementById('secretaryPhone').value.trim();
  settings.panNumber = document.getElementById('panNumber').value.trim();
  settings.reg80g = document.getElementById('reg80g').value.trim();
  await saveSettings();
  showToast(t('toast_settings_saved'));
});

document.getElementById('donationForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const submitBtn = e.target.querySelector('button[type=submit]');
  submitBtn.disabled = true;

  const purposeItem = PURPOSE_ITEMS.find(i => i.key === purposeSelect.value);
  let purposeEn, purposeMl;
  if(purposeSelect.value === 'other'){
    const customText = document.getElementById('otherPurpose').value.trim() || 'Other';
    purposeEn = customText;
    purposeMl = customText;
  } else {
    purposeEn = purposeItem ? purposeItem.en : purposeSelect.value;
    purposeMl = purposeItem ? purposeItem.ml : purposeSelect.value;
  }

  const record = {
    receiptNo: await nextReceiptNo(),
    donorName: document.getElementById('donorName').value.trim(),
    donorPhone: document.getElementById('donorPhone').value.trim(),
    donorAddress: document.getElementById('donorAddress').value.trim(),
    amount: Number(amountInput.value),
    paymentMode: paymentModeSelect.value,
    purpose: purposeEn,
    purposeMl: purposeMl,
    date: document.getElementById('donationDate').value,
    createdAt: new Date().toISOString()
  };

  donations.unshift(record);
  await saveDonations();
  submitBtn.disabled = false;
  e.target.reset();
  document.getElementById('donationDate').value = todayStr();
  document.getElementById('amountWords').textContent = '';
  populatePurposeOptions('general');
  populatePaymentModeOptions('UPI');

  showReceipt(record);
  showToast(t('toast_donation_saved') + record.receiptNo);
});

// ---------- Receipt ----------
function receiptHTML(r){
  const displayPurpose = (lang === 'ml' && r.purposeMl) ? r.purposeMl : r.purpose;
  const paymentItem = PAYMENT_MODES.find(i => i.key === r.paymentMode);
  const displayPaymentMode = paymentItem ? purposeLabel(paymentItem) : r.paymentMode;
  return `
    <div class="receipt-head">
      <svg class="om" width="26" height="26" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#7A1F2B" stroke-width="1.6" stroke-linecap="round">
          <path d="M20 34 C20 34 8 27 8 18 C8 12 12 8 16 10 C18 11 19 14 20 17 C21 14 22 11 24 10 C28 8 32 12 32 18 C32 27 20 34 20 34 Z"/>
          <path d="M20 34 C20 34 14 25 20 17 C26 25 20 34 20 34 Z" fill="#C79A3D" stroke="none" opacity="0.55"/>
        </g>
        <circle cx="20" cy="6" r="2" fill="#7A1F2B"/>
      </svg>
      <h3>${t('temple_name')}</h3>
      <div class="a2">${t('temple_addr')}</div>
    </div>
    <div class="receipt-meta">
      <span>${t('receipt_no_label')} <b>${r.receiptNo}</b></span>
      <span>${t('date_label')} <b>${formatDateDisplay(r.date)}</b></span>
    </div>
    <div class="receipt-body">
      <p><span class="label">${t('received_from')}</span><br><span class="val">${r.donorName}</span></p>
      ${r.donorPhone ? `<p><span class="label">${t('phone_label')}</span><br><span class="val">${r.donorPhone}</span></p>` : ''}
      ${r.donorAddress ? `<p><span class="label">${t('address_label')}</span><br><span class="val">${r.donorAddress}</span></p>` : ''}
      <div class="receipt-amount-box">
        <div class="figure">${inr(r.amount)}</div>
        <div class="words">${amountToWordsLocalized(r.amount)}</div>
      </div>
      <p><span class="label">${t('towards_label')}</span><br><span class="val">${displayPurpose}</span></p>
      <p><span class="label">${t('payment_mode_label')}</span><br><span class="val">${displayPaymentMode}</span></p>
      ${settings.reg80g ? `
      <div style="margin-top:14px;padding:10px 12px;border:1px dashed var(--green);border-radius:6px;font-size:11.5px;color:var(--green);line-height:1.6;">
        ${t('tax_note')}
        ${settings.reg80g ? `<br>${t('reg80g_label')} <b>${settings.reg80g}</b>` : ''}
        ${settings.panNumber ? `&nbsp;&nbsp;|&nbsp;&nbsp;${t('pan_label')} <b>${settings.panNumber}</b>` : ''}
      </div>` : ''}
    </div>
    <div class="receipt-foot">
      <div style="font-size:11px;color:var(--ink-soft);">${t('issued_by_note')}${settings.secretaryPhone ? '<br>'+t('contact_label')+' '+settings.secretaryPhone : ''}</div>
      <div class="sign-line">${settings.secretaryName || t('authorised_signatory')}${settings.secretaryDesignation ? '<br>'+settings.secretaryDesignation : ''}</div>
    </div>
  `;
}
let currentReceipt = null;
function showReceipt(r){
  currentReceipt = r;
  document.getElementById('receiptPrintArea').innerHTML = receiptHTML(r);
  document.getElementById('receiptOverlay').classList.add('show');
}
document.getElementById('downloadPdfBtn').addEventListener('click', async ()=>{
  if(!currentReceipt || !window.jspdf || !window.html2canvas){ showToast(t('toast_pdf_lib_not_ready')); return; }
  const btn = document.getElementById('downloadPdfBtn');
  const originalLabel = btn.textContent;
  btn.textContent = t('generating');
  btn.disabled = true;
  try{
    if(document.fonts && document.fonts.ready){ await document.fonts.ready; }
    const el = document.getElementById('receiptPrintArea');
    const canvas = await window.html2canvas(el, {
      scale: 2,
      backgroundColor: '#ffffff',
      useCORS: true
    });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    // Build the page to exactly fit the receipt's own aspect ratio, so nothing
    // is ever cut off — a fixed page size (e.g. A5) can be shorter than the
    // actual receipt height once donor details / 80G notes are included.
    const pageWidth = 420; // pt, ~A5 width
    const pageHeight = (canvas.height * pageWidth) / canvas.width;
    const pdf = new jsPDF({ unit: 'pt', format: [pageWidth, pageHeight] });
    pdf.addImage(imgData, 'PNG', 0, 0, pageWidth, pageHeight);
    pdf.save('Receipt-' + currentReceipt.receiptNo.replace(/\//g,'-') + '.pdf');
  }catch(err){
    showToast(t('toast_pdf_error'));
  }finally{
    btn.textContent = originalLabel;
    btn.disabled = false;
  }
});
document.getElementById('closeReceipt').addEventListener('click', ()=>{
  document.getElementById('receiptOverlay').classList.remove('show');
});
document.getElementById('closeReceiptBtn').addEventListener('click', ()=>{
  document.getElementById('receiptOverlay').classList.remove('show');
});
document.getElementById('printReceiptBtn').addEventListener('click', ()=>{
  window.print();
});

// ---------- Ledger ----------
function renderLedger(){
  const search = document.getElementById('searchBox').value.trim().toLowerCase();
  const filterDate = document.getElementById('filterDate').value;

  let rows = donations.filter(r=>{
    const matchesSearch = !search ||
      r.donorName.toLowerCase().includes(search) ||
      r.receiptNo.toLowerCase().includes(search);
    const matchesDate = !filterDate || r.date === filterDate;
    return matchesSearch && matchesDate;
  });

  const total = rows.reduce((s,r)=>s+Number(r.amount||0), 0);
  const todayTotal = donations.filter(r=>r.date===todayStr()).reduce((s,r)=>s+Number(r.amount||0),0);

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${inr(todayTotal)}</div><div class="l">${t('stat_today')}</div></div>
    <div class="stat"><div class="n">${rows.length}</div><div class="l">${t('stat_records')}</div></div>
    <div class="stat"><div class="n">${inr(total)}</div><div class="l">${t('stat_total_filtered')}</div></div>
  `;

  const wrap = document.getElementById('ledgerTableWrap');
  if(rows.length === 0){
    wrap.innerHTML = `<div class="empty"><div class="big">${t('empty_title')}</div>${t('empty_sub')}</div>`;
    return;
  }

  wrap.innerHTML = `
    <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>${t('th_receipt_no')}</th><th>${t('th_date')}</th><th>${t('th_donor')}</th><th>${t('th_purpose')}</th><th>${t('th_mode')}</th><th>${t('th_amount')}</th><th></th>
        </tr>
      </thead>
      <tbody>
        ${rows.map((r,idx)=>{
          const displayPurpose = (lang === 'ml' && r.purposeMl) ? r.purposeMl : r.purpose;
          const paymentItem = PAYMENT_MODES.find(i => i.key === r.paymentMode);
          const displayMode = paymentItem ? purposeLabel(paymentItem) : r.paymentMode;
          return `
          <tr>
            <td>${r.receiptNo}</td>
            <td>${formatDateDisplay(r.date)}</td>
            <td>${r.donorName}</td>
            <td>${displayPurpose}</td>
            <td><span class="pill">${displayMode}</span></td>
            <td class="amt">${inr(r.amount)}</td>
            <td><button class="link-btn" data-receipt="${r.receiptNo}">${t('btn_reprint')}</button></td>
          </tr>
        `;}).join('')}
      </tbody>
    </table>
    </div>
  `;

  wrap.querySelectorAll('[data-receipt]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const rec = donations.find(d=>d.receiptNo === btn.dataset.receipt);
      if(rec) showReceipt(rec);
    });
  });
}

document.getElementById('searchBox').addEventListener('input', renderLedger);
document.getElementById('filterDate').addEventListener('change', renderLedger);
document.getElementById('clearFilters').addEventListener('click', ()=>{
  document.getElementById('searchBox').value = '';
  document.getElementById('filterDate').value = '';
  renderLedger();
});

// ---------- Reports ----------
function populateReportYears(){
  const sel = document.getElementById('reportYear');
  const years = Array.from(new Set(donations.map(d => d.date.slice(0,4))));
  const thisYear = String(new Date().getFullYear());
  if(!years.includes(thisYear)) years.push(thisYear);
  years.sort((a,b)=>b.localeCompare(a));
  sel.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
  sel.value = thisYear;
}

function renderReports(){
  populateReportYears();
  renderReportForYear();
}

function renderReportForYear(){
  const year = document.getElementById('reportYear').value;
  const yearRecords = donations.filter(d => d.date.slice(0,4) === year);
  const monthNames = MONTH_NAMES_I18N[lang] || MONTH_NAMES_I18N.en;

  // Month-wise
  const monthly = Array(12).fill(0).map(()=>({count:0, total:0}));
  yearRecords.forEach(r=>{
    const m = parseInt(r.date.slice(5,7),10) - 1;
    monthly[m].count += 1;
    monthly[m].total += Number(r.amount||0);
  });
  const yearTotal = monthly.reduce((s,m)=>s+m.total,0);
  const yearCount = monthly.reduce((s,m)=>s+m.count,0);

  // Purpose-wise (keyed by canonical English purpose, but remember the Malayalam label too)
  const byPurpose = {};
  yearRecords.forEach(r=>{
    byPurpose[r.purpose] = byPurpose[r.purpose] || {count:0, total:0, ml:r.purposeMl || r.purpose};
    byPurpose[r.purpose].count += 1;
    byPurpose[r.purpose].total += Number(r.amount||0);
  });

  const monthRows = monthly.map((m,i)=>`
    <tr>
      <td>${monthNames[i]}</td>
      <td>${m.count}</td>
      <td class="amt">${inr(m.total)}</td>
    </tr>
  `).join('');

  const purposeRows = Object.entries(byPurpose).sort((a,b)=>b[1].total-a[1].total).map(([p,v])=>`
    <tr>
      <td>${lang === 'ml' ? v.ml : p}</td>
      <td>${v.count}</td>
      <td class="amt">${inr(v.total)}</td>
    </tr>
  `).join('');

  const totalForYearLabel = lang === 'ml' ? `${year}-ലെ ആകെ` : `Total for ${year}`;
  const donationsForYearLabel = lang === 'ml' ? `${year}-ലെ സംഭാവനകൾ` : `Donations for ${year}`;

  document.getElementById('reportContent').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="n">${inr(yearTotal)}</div><div class="l">${totalForYearLabel}</div></div>
      <div class="stat"><div class="n">${yearCount}</div><div class="l">${donationsForYearLabel}</div></div>
      <div class="stat"><div class="n">${yearCount ? inr(Math.round(yearTotal/yearCount)) : inr(0)}</div><div class="l">${t('stat_avg_donation')}</div></div>
    </div>
    <h3 style="font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--maroon-dark);margin:18px 0 10px;">${t('heading_month_wise')}</h3>
    <div class="table-scroll">
    <table>
      <thead><tr><th>${t('th_month')}</th><th>${t('th_donations')}</th><th>${t('th_total')}</th></tr></thead>
      <tbody>${monthRows || `<tr><td colspan="3" style="text-align:center;color:var(--ink-soft);">${t('no_records')}</td></tr>`}</tbody>
    </table>
    </div>
    <h3 style="font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--maroon-dark);margin:22px 0 10px;">${t('heading_by_purpose')}</h3>
    <div class="table-scroll">
    <table>
      <thead><tr><th>${t('th_purpose')}</th><th>${t('th_donations')}</th><th>${t('th_total')}</th></tr></thead>
      <tbody>${purposeRows || `<tr><td colspan="3" style="text-align:center;color:var(--ink-soft);">${t('no_records')}</td></tr>`}</tbody>
    </table>
    </div>
  `;
}
document.getElementById('reportYear').addEventListener('change', renderReportForYear);

// ---------- Excel Export ----------
document.getElementById('exportExcelBtn').addEventListener('click', ()=>{
  if(!window.XLSX){ showToast(t('toast_excel_lib_not_ready')); return; }
  const search = document.getElementById('searchBox').value.trim().toLowerCase();
  const filterDate = document.getElementById('filterDate').value;
  let rows = donations.filter(r=>{
    const matchesSearch = !search || r.donorName.toLowerCase().includes(search) || r.receiptNo.toLowerCase().includes(search);
    const matchesDate = !filterDate || r.date === filterDate;
    return matchesSearch && matchesDate;
  });
  if(rows.length === 0){ showToast(t('toast_no_records_export')); return; }

  const sheetData = rows.map(r => ({
    "Receipt No": r.receiptNo,
    "Date": r.date,
    "Donor Name": r.donorName,
    "Phone": r.donorPhone || '',
    "Address": r.donorAddress || '',
    "Purpose": r.purpose,
    "Payment Mode": r.paymentMode,
    "Amount (INR)": r.amount
  }));
  const totalRow = { "Receipt No": '', "Date": '', "Donor Name": '', "Phone": '', "Address": '', "Purpose": '', "Payment Mode": 'TOTAL', "Amount (INR)": rows.reduce((s,r)=>s+Number(r.amount||0),0) };
  sheetData.push(totalRow);

  const ws = XLSX.utils.json_to_sheet(sheetData);
  ws['!cols'] = [{wch:16},{wch:12},{wch:22},{wch:14},{wch:22},{wch:20},{wch:12},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Donations");
  const stamp = todayStr();
  XLSX.writeFile(wb, `Temple-Donations-${stamp}.xlsx`);
});

// ---------- PWA: Install prompt ----------
let deferredInstallPrompt = null;
const installBtn = document.getElementById('installBtn');
const iosHint = document.getElementById('iosInstallHint');

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  installBtn.style.display = 'inline-block';
});

installBtn.addEventListener('click', async ()=>{
  if(!deferredInstallPrompt) return;
  installBtn.style.display = 'none';
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
});

window.addEventListener('appinstalled', ()=>{
  installBtn.style.display = 'none';
  iosHint.style.display = 'none';
});

(function checkIOS(){
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(isIOS && !isStandalone){
    iosHint.style.display = 'inline-block';
  }
})();

// ---------- PWA: Service worker (enables install + offline) ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{ /* non-fatal */ });
  });
}

// ---------- Language engine ----------
function applyStaticI18n(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    el.placeholder = t(el.dataset.i18nPh);
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    el.innerHTML = t(el.dataset.i18nHtml);
  });
  document.querySelectorAll('.lang-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}

function applyLanguage(newLang){
  lang = newLang;
  localStorage.setItem(LANG_KEY, lang);
  applyStaticI18n();
  populatePurposeOptions();
  populatePaymentModeOptions();

  // Re-render whichever tab is currently visible, so already-displayed
  // content (ledger rows, reports) switches language immediately too.
  if(document.getElementById('tab-ledger').style.display !== 'none') renderLedger();
  if(document.getElementById('tab-reports').style.display !== 'none') renderReportForYear();

  // If a receipt is currently open, regenerate it in the new language.
  if(currentReceipt && document.getElementById('receiptOverlay').classList.contains('show')){
    document.getElementById('receiptPrintArea').innerHTML = receiptHTML(currentReceipt);
  }
}

document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(btn.dataset.lang !== lang) applyLanguage(btn.dataset.lang);
  });
});

// ---------- Init ----------
(async function init(){
  await loadData();
  applyStaticI18n();
  populatePurposeOptions();
  populatePaymentModeOptions();
  renderLedger();
})();
</script>
